name: Millionaire Autonomous Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes automatically 24/7
  workflow_dispatch:        # Allows manual start button instantly

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install web3 requests

      - name: Run Millionaire Business Bot
        env:
          WEB3_RPC_URL: ${{ secrets.WEB3_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USDT_WALLET: ${{ secrets.USDT_WALLET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
          
